name: Fetch media from Cargo

# Runs whenever the media list changes, or by hand from the Actions tab.
on:
  push:
    paths:
      - media/manifest.tsv
      - scripts/fetch-media.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - name: Download and convert media
        run: bash scripts/fetch-media.sh
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          if git diff --cached --quiet; then echo "No new media"; exit 0; fi
          git commit -m "Add media fetched from Cargo"
          git push
